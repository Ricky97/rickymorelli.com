    "email": "ricky@rickymorelli.com",
    "sameAs": [
      "https://www.linkedin.com/in/rickymorelli/",
      "https://substack.com/@rickymorelli"
    ]
  }
  </script>

  <style>
    @font-face {
      font-family: "Archivo";
      src: url("/fonts/archivo.woff2") format("woff2");
      font-weight: 720;
      font-style: normal;
      font-display: swap;
      unicode-range: U+0020-007E;
    }

    @font-face {
      font-family: "Lora";
      src: url("/fonts/lora.woff2") format("woff2");
      font-weight: 460;
      font-style: normal;
      font-display: swap;
      unicode-range: U+0020-007E;
    }

    @font-face {
      font-family: "Martian Mono";
      src: url("/fonts/martian-mono.woff2") format("woff2");
      font-weight: 500;
      font-style: normal;
      font-display: swap;
      unicode-range: U+0020-007E;
    }

    :root {
      --mist: #f8f6e8;
      --khaki: #c3be92;
      --bark: #463c2e;
      --line: #463c2e4d;
      --edge: 20px;
      color-scheme: light;
    }

    *, *::before, *::after { box-sizing: border-box; }

    html { height: 100%; }

    body {
      margin: 0;
      min-height: 100%;
      min-height: 100svh;
      display: flex;
      background: var(--khaki);
      color: var(--bark);
      font-family: "Lora", "Iowan Old Style", Palatino, Georgia, serif;
      font-weight: 460;
      font-size: 1.25rem;
      line-height: 1.2;
      letter-spacing: -0.02em;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 2;
      background:
        linear-gradient(var(--line), var(--line)) var(--edge) 0 / 0.5px 100% no-repeat,
        linear-gradient(var(--line), var(--line)) calc(100% - var(--edge)) 0 / 0.5px 100% no-repeat;
    }

    .skip {
      position: absolute;
      left: 1rem;
      top: 0.75rem;
      transform: translateY(-150%);
      background: var(--bark);
      color: var(--mist);
      padding: 0.55rem 0.75rem;
      z-index: 5;
      text-decoration: none;
      font-family: "Martian Mono", ui-monospace, monospace;
      font-size: 0.75rem;
      letter-spacing: -0.04em;
      text-transform: uppercase;
    }

    .skip:focus {
      transform: none;
      outline: 2px solid var(--bark);
      outline-offset: 3px;
    }

    main {
      position: relative;
      z-index: 1;
      width: min(40rem, 100%);
      margin: auto;
      padding: 4rem 1.35rem 3rem;
      text-align: center;
    }

    h1, p { margin: 0; }

    h1 {
      font-family: "Archivo", "Arial Narrow", "Helvetica Neue", sans-serif;
      font-weight: 720;
      font-size: clamp(2.65rem, 13.2vw, 6.25rem);
      line-height: 0.86;
      letter-spacing: -0.05em;
    }

    .lede {
      max-width: 18em;
      margin: 2.25rem auto 0;
      font-size: clamp(1.15rem, 2.4vw, 1.5rem);
      text-wrap: balance;
    }

    .links {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 0.25rem 1.5rem;
      margin: 2rem 0 0;
      padding: 0;
      list-style: none;
    }

    .links a,
    .agent {
      color: inherit;
      text-decoration: none;
    }

    .links a {
      position: relative;
      display: inline-flex;
      align-items: center;
      min-height: 44px;
      padding: 0.65rem 0.1rem;
      font-family: "Martian Mono", ui-monospace, monospace;
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: -0.06em;
      line-height: 1.3;
      text-transform: uppercase;
    }

    .links a::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0.55rem;
      height: 1px;
      background: currentColor;
      transform: scaleX(0);
      transform-origin: left center;
    }

    .links a:hover::after,
    .links a:focus-visible::after {
      transform: scaleX(1);
    }

    .agent {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1.25rem;
      width: min(100%, 22rem);
      min-height: 52px;
      margin: 2.5rem auto 0;
      padding: 0.9rem 1rem;
      background: var(--bark);
      color: var(--mist);
      font-family: "Martian Mono", ui-monospace, monospace;
      font-size: 0.8rem;
      font-weight: 500;
      letter-spacing: -0.04em;
      line-height: 1;
      text-transform: uppercase;
    }

    .agent svg {
      width: 12px;
      height: 10px;
      flex: none;
    }

    a:focus-visible {
      outline: 2px solid var(--bark);
      outline-offset: 4px;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 900px) {
      :root { --edge: 10px; }
    }

    @media (min-width: 900px) {
      .lede { margin-top: 3rem; }
      .links { margin-top: 2.5rem; }
      .agent { margin-top: 3rem; }
    }

    @media (prefers-reduced-motion: no-preference) {
      .links a::after,
      .agent {
        transition: transform 300ms ease, opacity 300ms ease;
      }
    }

    @media (hover: hover) {
      .agent:hover { opacity: 0.82; }
    }

    @media print {
      body { background: #fff; }
      body::before, .skip { display: none; }
      .agent { border: 1px solid #000; }
    }
  </style>
</head>
<body>
  <a class="skip" href="#content">Skip to content</a>
  <main id="content">
    <h1>Ricky<br>Morelli</h1>
    <p class="lede">Growth, paid media and creative for ecommerce brands.</p>
    <ul class="links">
      <li>
        <a href="https://substack.com/@rickymorelli" rel="me noopener noreferrer" target="_blank">Substack<span class="sr-only"> (opens in a new tab)</span></a>
      </li>
      <li>
        <a href="https://www.linkedin.com/in/rickymorelli/" rel="me noopener noreferrer" target="_blank">LinkedIn<span class="sr-only"> (opens in a new tab)</span></a>
      </li>
      <li>
        <a href="mailto:ricky@rickymorelli.com">Email</a>
      </li>
    </ul>
    <!-- TODO: Replace href="/agent" with the live personal agent URL. The agent is not built yet. -->
    <a class="agent" href="/agent">
      <span>Ask my agent</span>
      <svg viewBox="0 0 12 10" aria-hidden="true" focusable="false">
        <path d="M6.3.7 10.1 4.5H0v1h10.1L6.3 9.3 7 10 12 5 7 0z" fill="currentColor"/>
      </svg>
    </a>
  </main>
</body>
</html>
