  <style>
    @font-face {
      font-family: "Inter Tight";
      src: url("/fonts/inter-tight-900.woff2") format("woff2");
      font-weight: 900;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "IBM Plex Mono";
      src: url("/fonts/ibm-plex-mono-400.woff2") format("woff2");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --paper: #ece8e0;
      --ink: #1a1714;
      --muted: #5c564e;
      --accent: #f0501e;
      --mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace;
      --pad: clamp(1.15rem, 4vw, 3.25rem);
      --idx: 4.75rem;
      color-scheme: light;
    }

    *, *::before, *::after { box-sizing: border-box; }

    html {
      background: var(--paper);
      height: 100%;
    }

    body {
      margin: 0;
      min-height: 100%;
      min-height: 100svh;
      display: grid;
      grid-template-rows: auto 1fr;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--mono);
      font-weight: 400;
      font-size: 0.8125rem;
      line-height: 1.4;
      text-rendering: geometricPrecision;
      -webkit-font-smoothing: antialiased;
    }

    ::selection {
      background: var(--accent);
      color: var(--paper);
    }

    .skip {
      position: absolute;
      left: var(--pad);
      top: 0.75rem;
      transform: translateY(-160%);
      background: var(--ink);
      color: var(--paper);
      padding: 0.55rem 0.7rem;
      z-index: 5;
      text-decoration: none;
      font-family: var(--mono);
      font-size: 0.75rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .skip:focus {
      transform: none;
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    .kicker {
      margin: 0;
      padding: clamp(1.35rem, 3.4vh, 2.15rem) var(--pad) 0 calc(var(--pad) + var(--idx));
      color: var(--muted);
      font-size: 0.8125rem;
      line-height: 1.45;
      letter-spacing: 0.005em;
      text-wrap: balance;
    }

    main {
      display: flex;
      align-items: center;
      min-height: 0;
      padding: clamp(1.75rem, 7vh, 4.5rem) var(--pad) clamp(2.5rem, 11vh, 6.5rem) calc(var(--pad) + var(--idx));
    }

    .poster {
      width: 100%;
      container-type: inline-size;
    }

    h1, p, ul, ol { margin: 0; }

    h1 {
      font-size: inherit;
      font-weight: inherit;
    }

    .stack {
      padding: 0;
      list-style: none;
    }

    .line {
      position: relative;
      display: grid;
      grid-template-columns: max-content minmax(0, max-content);
      column-gap: clamp(0.85rem, 1.6vw, 1.35rem);
      align-items: center;
      color: inherit;
      text-decoration: none;
    }

    .label {
      position: relative;
      font-family: "Inter Tight", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
      font-weight: 900;
      font-size: clamp(2.15rem, 9vw, 8.35rem);
      font-size: clamp(2.15rem, 15.2cqi, 8.35rem);
      line-height: 0.88;
      letter-spacing: -0.046em;
      font-kerning: normal;
      white-space: nowrap;
    }

    .idx {
      position: absolute;
      top: 50%;
      right: calc(100% + clamp(0.7rem, 1.5vw, 1.15rem));
      transform: translateY(-54%);
      color: var(--muted);
      font-family: var(--mono);
      font-size: 0.8125rem;
      font-weight: 400;
      letter-spacing: 0.02em;
      line-height: 1;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
      user-select: none;
    }

    .dash {
      display: inline-block;
      width: 1.05em;
      height: 1.5px;
      margin-right: 0.42em;
      background: var(--accent);
      vertical-align: 0.14em;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .note {
      color: var(--muted);
      font-family: var(--mono);
      font-size: 0.8125rem;
      font-weight: 400;
      letter-spacing: 0.01em;
      line-height: 1.35;
      text-wrap: pretty;
      max-width: 16rem;
      transform: translateY(0.12em);
    }

    .stack a:hover .label,
    .stack a:focus-visible .label {
      color: var(--accent);
    }

    .stack a:focus-visible {
      outline: none;
    }

    .stack a:focus-visible .label {
      outline: 2px solid var(--ink);
      outline-offset: 0.06em;
    }

    /* Notes sit beside the word while the row is wide, and under it when it is not. */
    @container (max-width: 1040px) {
      .stack a {
        grid-template-columns: minmax(0, 1fr);
        justify-items: start;
        row-gap: 0.22rem;
        padding-bottom: 0.42rem;
      }

      .note {
        max-width: 18rem;
        transform: none;
      }
    }

    @media (max-width: 860px) {
      :root { --idx: 3.35rem; }
    }

    @media (max-width: 420px) {
      :root { --idx: 2.9rem; --pad: 1rem; }

      .label {
        letter-spacing: -0.04em;
      }
    }

    @media (prefers-reduced-motion: no-preference) {
      .label {
        transition: color 160ms ease;
      }
    }

    @media print {
      body { background: #fff; }
      .skip { display: none; }
      .label { font-size: 42pt; }
    }
  </style>
</head>
<body>
  <a class="skip" href="#content">Skip to content</a>

  <main id="content">

            <span class="note">Profile</span>

          </a>
        </li>
        <li>

            <span class="note">Writing on ad tech and money</span>
            <span class="sr-only"> (opens in a new tab)</span>
          </a>
        </li>
        <li>

          <a class="line" href="/agent">

            <span class="note">Personal agent</span>
          </a>
        </li>
      </ol>
    </div>
  </main>
</body>
</html>
